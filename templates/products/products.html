<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - URBEXA</title>
    {% load static %}
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{% static 'css/products.css' %}">

    <script>

        function goto(url) {
            window.location.href = url;
        }

    </script>
</head>

<body>
    <Header>
        <div class="header">
            <div class="cont-logo">
                <img onclick="goto('../..')" class="logo" src="{% static 'images/logo.png' %}">
            </div>
            <h2 class="text-xl font-size absolute -top-1 right-2 p-4 text-black font-bold cursor-pointer "
                onclick="goto('../cart')">
                Cart
            </h2>

        </div>
        <script>

        </script>
    </Header>
    <div class="alertdiv">
        {% for message in messages %}
        <p class="alert" href="">{{message}}</p>
        {% endfor %}
    </div>
    <div class="cont-products">
        {% for product in products %}
        <div class="product-card">
            <img class="product-img" src="{{ product.image.url }}" alt="{{ product.name }}">
            <h1 class="product-name">{{product.name}}</h1>
            <h4 class="product-price">R$ {{product.price}}</h4>
            <button onclick="goto('../products/addtocart/{{ product.id }}/')" class="btn-buy">buy</button>
        </div>
        {%endfor%}
    </div>
    <script>


        const delay = 1500; // 3 segundos
        const alerts = document.querySelectorAll('.alert');


        alerts.forEach(alert => {
            setTimeout(() => {
                alert.classList.add('hide');
            }, delay);
        });


    </script>
</body>

</html>

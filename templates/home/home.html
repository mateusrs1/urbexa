<!DOCTYPE html>
<html lang="PT-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% load static %}
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{% static 'css/home.css' %}" />
    <title>URBEXA</title>

</head>

<body>
    <main>

        <header>
            <div class="header">

                <a href="">
                    <img class="logo" src="{% static 'images/logo.png' %}">
                </a>
                <div class="nav-right">
                    <ul class="btn-header">
                        <li><a class="head-btn li-title" href="products">Product</a></li>
                        <li><a class="li-title" onclick="moveimg()">About</a></li>
                        <li><a class="li-title" href="cart">cart</a></li>
                        {%if user.is_authenticated%} <li><a href="auth/user" class="li-title">{{ username }}</a>
                        </li>
                        {%else%} <li><a class="li-title" href="login">login</a></li> {%endif%}
                        <button class="menu-toggle" aria-label="Abrir menu">&#9776;</button>


                        <a href="auth/user"><img class="perfil" src="{% static 'images/user-perfil.png' %}"></a>

                    </ul>
                </div>
            </div>
        </header>
        <div class="alertdiv">
            {% for message in messages %}
            <p class="alert" href="">{{message}}</p>
            {% endfor %}
        </div>

        <div class="container-box">
            <div class="box left">
                <h1>Fashion</h1>
            </div>
            <div class="box right">
                <h1>Fashion</h1>
            </div>
        </div>

        <div class="hero-div">
            <div class="Carousel ">
                <img id="carousel-img" src="{% static 'images/AdobeStock_517876305_Preview.jpeg' %}" alt="foto">
            </div>

        </div>

    </main>

    <script>


        const delay = 1500; // 3 segundos
        const alerts = document.querySelectorAll('.alert');


        alerts.forEach(alert => {
            setTimeout(() => {
                alert.classList.add('hide');
            }, delay);
        });


    </script>

    <script>
        const carouselimg = document.getElementById("carousel-img");

        let carouselimage = [
            "{% static 'images/AdobeStock_517876305_Preview.jpeg'%}",
            "{% static 'images/1000_F_548477704_fYSpo7TRTtKlIq9C2QZ0KczwJWSSMJgl.jpg'%}",
            "{% static 'images/1000_F_1055339745_yReUufviE4zl4Vtr4thcgzkbeqMWOZkq.jpg'%}",
        ];



        let currentindex = 0;
        let anim = 0;

        function moveimg() {

            if (currentindex < carouselimage.length - 1) { currentindex += 1; anim += 1; } else { currentindex = 0 };
            carouselimg.src = carouselimage[currentindex];
        }; setInterval(moveimg, 3000); </script>
</body>

</html>
